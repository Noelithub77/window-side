[package]
name = "window-side"
version = "0.1.0"
edition = "2024"
description = "Run your dual-boot Windows install as a headless VM from Linux"
license = "GPL-2.0-or-later"
repository = "https://github.com/Noelithub77/window-side"

[[bin]]
name = "ws"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri = { version = "=2.12.4", features = ["devtools", "image-png"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta-typescript = "=0.0.12"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
notify-rust = "4.18.2"
# Use the async-io runtime shared with desktop D-Bus integrations.
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
zbus = "5.19.0"

[build-dependencies]
tauri-build = "=2.7.3"
