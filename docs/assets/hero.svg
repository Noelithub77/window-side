<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">window-side — your Windows, beside Linux</title>
  <desc id="desc">Four rounded mint panes beside the window-side wordmark on a dark background.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#24463f"/><stop offset="1" stop-color="#101515"/></radialGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#c4fbec"/><stop offset="1" stop-color="#6fdcc1"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#101515"/>
  <ellipse cx="990" cy="210" rx="310" ry="210" fill="url(#glow)"/>
  <g transform="translate(84 134)">
    <rect width="70" height="70" rx="20" fill="url(#mint)"/>
    <rect x="78" width="70" height="70" rx="20" fill="url(#mint)" opacity=".82"/>
    <rect y="78" width="70" height="70" rx="20" fill="url(#mint)" opacity=".82"/>
    <rect x="78" y="78" width="70" height="70" rx="20" fill="url(#mint)" opacity=".6"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif">
