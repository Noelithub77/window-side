submenu 'Advanced options for Ubuntu' $menuentry_id_option 'gnulinux-advanced-123' {
    menuentry 'Ubuntu, with Linux 6.8.0-71-generic' --class ubuntu $menuentry_id_option 'gnulinux-6.8.0-71-generic-advanced-123' {
        recordfail
        load_video
        insmod gzio
        insmod part_gpt
        insmod ext2
        if [ x$feature_platform_search_hint = xy ]; then
            search --no-floppy --fs-uuid --set=root --hint-bios=hd0,gpt2 1234
        else
            search --no-floppy --fs-uuid --set=root 1234
        fi
        linux /boot/vmlinuz-6.8.0-71-generic root=UUID=1234 ro quiet splash
        initrd /boot/initrd.img-6.8.0-71-generic
    }
}
