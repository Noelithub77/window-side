name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build and fixture tools
        run: pacman -Syu --noconfirm --needed git rust clang cmake pkgconf libxcb libxkbcommon libxkbcommon-x11 fontconfig wayland vulkan-headers vulkan-icd-loader jq ripgrep desktop-file-utils
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the locked release and installer fixtures
        run: ./ops check:release
